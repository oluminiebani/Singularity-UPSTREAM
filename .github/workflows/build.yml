name: Build Singularity Kernel (OP8 / SM8250)

on:
  workflow_dispatch:
  push:
    branches:
      - plasma

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install Dependencies and Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libncurses5-dev libssl-dev libxml2-utils lz4 python3 unzip zip zstd wget clang-15 lld-15 llvm-15 binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
          sudo ln -sf /usr/bin/clang-15 /usr/bin/clang
          sudo ln -sf /usr/bin/ld.lld-15 /usr/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-15 /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-15 /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-15 /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-15 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-strip-15 /usr/bin/llvm-strip

      - name: Checkout Fork and Fetch V17 Tag
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Switch to Stable V17 and Apply Touch Fix
        run: |
          git fetch --depth=1 https://github.com/The-Anomalist/Singularity.git refs/tags/V17:refs/tags/V17
          git checkout -f refs/tags/V17
          git submodule update --init --recursive
          git checkout origin/plasma -- drivers/input/touchscreen/oplus_touchscreen/Samsung/S6SY771/sec_drivers_s6sy771.c
          git checkout origin/plasma -- drivers/input/touchscreen/oplus_touchscreen/touchpanel_common_driver.c

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out ARCH=arm64 vendor/kona-perf_defconfig vendor/oplus.config
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC="clang" \
            LD="ld.lld" \
            AR="llvm-ar" \
            NM="llvm-nm" \
            OBJCOPY="llvm-objcopy" \
            OBJDUMP="llvm-objdump" \
            STRIP="llvm-strip" \
            CLANG_TRIPLE="aarch64-linux-gnu-" \
            CROSS_COMPILE="aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
            Image.gz

      - name: Package AnyKernel3 Zip
        run: |
          git clone --depth=1 https://github.com/The-Anomalist/Singularity.git -b master AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/README.md AnyKernel3/modules AnyKernel3/patch AnyKernel3/ramdisk
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's/block=\/dev\/block\/platform\/omap\/omap_hsmmc.0\/by-name\/boot;/block=boot;/g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
          cd AnyKernel3 && zip -r9 ../Singularity-OP8-TouchFix.zip *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Singularity-OP8-TouchFix
          path: Singularity-OP8-TouchFix.zip
