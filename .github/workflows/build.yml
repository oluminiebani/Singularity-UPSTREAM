name: Build Singularity Kernel (OP8 / SM8250)

on:
  workflow_dispatch:
  push:
    branches:
      - plasma

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libncurses5-dev libssl-dev libxml2-utils lz4 python3 unzip zip zstd

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Download Clang Toolchain
        run: |
          mkdir -p $HOME/clang
          curl -sL https://github.com -o clang.tar.gz || \
          git clone --depth=1 https://gitlab.com -b 19 $HOME/clang
          if [ -f clang.tar.gz ]; then tar -xzf clang.tar.gz -C $HOME/clang; fi

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$HOME/clang/bin:$PATH"
          make O=out ARCH=arm64 vendor/kona-perf_defconfig vendor/oplus.config
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC="clang" \
            LD="ld.lld" \
            AR="llvm-ar" \
            NM="llvm-nm" \
            OBJCOPY="llvm-objcopy" \
            OBJDUMP="llvm-objdump" \
            STRIP="llvm-strip" \
            CLANG_TRIPLE="aarch64-linux-gnu-" \
            CROSS_COMPILE="aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
            Image.gz dtbo.img

      - name: Package AnyKernel3 Zip
        run: |
          git clone --depth=1 https://github.com -b master AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/README.md AnyKernel3/modules AnyKernel3/patch AnyKernel3/ramdisk
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's/block=\/dev\/block\/platform\/omap\/omap_hsmmc.0\/by-name\/boot;/block=boot;/g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
          cd AnyKernel3 && zip -r9 ../Singularity-OP8-TouchFix.zip *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Singularity-OP8-TouchFix
          path: Singularity-OP8-TouchFix.zip
